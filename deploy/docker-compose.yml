# Run from the repo root through the npm scripts (npm run docker:up | docker:logs | docker:down), which pass
# `--env-file .env` so ${API_DOMAIN} resolves. See deploy/README.md.
#
# Needs at the repo root on the host (never baked into the image):
#   .env          shared values (Privy, Bankr, WEBHOOK_SECRET, PUBLIC_API_URL, CORS_ORIGIN, ...) plus API_DOMAIN=api.example.com
#   .env.mainnet  NETWORK=base, DEPLOYER_PRIVATE_KEY, KEEPER_MIN_USDC, ...   (later env files win)
# First run only: docker compose exec api bankr login
services:
  api:
    build:
      context: ..                          # repo root: the server imports packages/shared
      dockerfile: deploy/server.Dockerfile
    env_file:
      - ../.env
      - ../.env.mainnet
    environment:
      # `environment` beats env_file: keep the database on the volume whatever the overlay says
      DB_PATH: /data/vouch-mainnet.db
      TRUST_PROXY: "1"        # Caddy is in front: rate limits use the real client IP from X-Forwarded-For
    stop_grace_period: 130s   # on stop the server waits for a swap or publish in flight (up to 120s) before closing
    volumes:
      - vouch-data:/data
    restart: unless-stopped
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, e.g. api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  vouch-data:
  caddy-data:
  caddy-config:
